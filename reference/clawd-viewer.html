<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>블록 캐릭터 뷰어</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f3efe8;
    --panel: #fffdf9;
    --ink: #2b2420;
    --muted: #7a6e64;
    --line: #ddd3c6;
    --accent: #c4623a;
    --accent-ink: #ffffff;
    --stage: #ece5da;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1714; --panel: #252019; --ink: #f0e8de; --muted: #a09385;
      --line: #3a322a; --accent: #e07b4f; --accent-ink: #1b1714; --stage: #151210;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1714; --panel: #252019; --ink: #f0e8de; --muted: #a09385;
    --line: #3a322a; --accent: #e07b4f; --accent-ink: #1b1714; --stage: #151210;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  h1 { font-size: 1.15rem; margin: 0; font-weight: 700; }
  p.sub { margin: 2px 0 0; color: var(--muted); font-size: .88rem; }
  #stage {
    position: relative; width: 100%; aspect-ratio: 1 / 1; max-height: 62vh;
    background: var(--stage); border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden; touch-action: none; cursor: grab;
  }
  #stage:active { cursor: grabbing; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #hint {
    position: absolute; left: 12px; bottom: 10px; font-size: .78rem; color: var(--muted);
    pointer-events: none;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; display: grid; gap: 12px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  label { font-size: .88rem; color: var(--muted); }
  input[type="text"] {
    flex: 1 1 200px; min-width: 0; padding: 10px 12px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }
  input[type="range"] { flex: 1 1 160px; accent-color: var(--accent); }
  button {
    font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); cursor: pointer; min-height: 42px;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button[aria-pressed="true"] { outline: 2px solid var(--accent); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #amp-val { font-variant-numeric: tabular-nums; min-width: 2.6em; text-align: right; font-size: .88rem; }
  .note { font-size: .8rem; color: var(--muted); margin: 0; }
  code { background: var(--bg); padding: 1px 5px; border-radius: 5px; font-size: .85em; }
</style>
</head>
<body>
<main>
  <header>
    <h1>블록 캐릭터 뷰어</h1>
    <p class="sub">외부 모델 파일 없이 Three.js 코드만으로 조립한 캐릭터입니다.</p>
  </header>

  <div id="stage" aria-label="3D 캐릭터 미리보기. 드래그해서 회전">
    <div id="hint">드래그해서 돌려보기</div>
  </div>

  <section class="panel" aria-label="말하기 제어">
    <div class="row">
      <input type="text" id="say" value="안녕하세요! 지금 메인 코드를 수정 중이에요." aria-label="캐릭터가 말할 문장">
      <button class="primary" id="btn-speak">말하기</button>
      <button id="btn-stop">멈추기</button>
    </div>
    <div class="row">
      <button id="btn-sim" aria-pressed="false">소리 없이 말하는 동작</button>
      <button id="btn-theme">화면 밝기 전환</button>
    </div>
    <div class="row">
      <label for="amp">수동 진폭</label>
      <input type="range" id="amp" min="0" max="100" value="0">
      <span id="amp-val">0.00</span>
    </div>
    <p class="note">내 프로젝트에서는 TTS 오디오의 볼륨 값을 <code>clawd.setAmplitude(0~1)</code>에 넣으면 됩니다. 이 페이지의 "말하기"는 브라우저 내장 음성(한국어 지원 여부는 기기마다 다름)의 단어 경계 이벤트로 움직임을 만듭니다.</p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 1.6, 9);
  camera.lookAt(0, 1.1, 0);

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.insertBefore(renderer.domElement, stage.firstChild);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a6a, 0.85));
  var key = new THREE.DirectionalLight(0xffffff, 0.8);
  key.position.set(4, 7, 6);
  scene.add(key);

  function mat(color) { return new THREE.MeshStandardMaterial({ color: color, roughness: 0.75, metalness: 0.0, flatShading: true }); }
  var ORANGE = 0xd9784f, DARK = 0x2a1e18;
  var bodyMat = mat(ORANGE), eyeMat = mat(DARK);

  function box(w, h, d, m, x, y, z, parent) {
    var mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    mesh.position.set(x, y, z);
    parent.add(mesh);
    return mesh;
  }

  // 캐릭터 루트: 회전은 root, 숨쉬기/들썩임은 body 그룹이 담당
  var root = new THREE.Group();
  scene.add(root);
  var rig = new THREE.Group();
  root.add(rig);

  // 몸통 (넓은 직육면체)
  var legH = 0.7;
  var bodyY = legH + 0.9;
  box(3.2, 1.8, 1.8, bodyMat, 0, bodyY, 0, rig);

  // 팔 (양옆 작은 블록)
  var armL = new THREE.Group(), armR = new THREE.Group();
  armL.position.set(-1.85, bodyY + 0.1, 0);
  armR.position.set(1.85, bodyY + 0.1, 0);
  box(0.6, 0.7, 0.8, bodyMat, 0, 0, 0, armL);
  box(0.6, 0.7, 0.8, bodyMat, 0, 0, 0, armR);
  rig.add(armL, armR);

  // 눈 (얼굴 앞면의 어두운 사각형)
  var eyeL = box(0.3, 0.55, 0.12, eyeMat, -0.75, bodyY + 0.2, 0.93, rig);
  var eyeR = box(0.3, 0.55, 0.12, eyeMat, 0.75, bodyY + 0.2, 0.93, rig);

  // 다리 4개
  var legXs = [-1.15, -0.4, 0.4, 1.15];
  legXs.forEach(function (x) { box(0.5, legH, 0.6, bodyMat, x, legH / 2, 0, rig); });

  // 바닥 그림자
  var shadow = new THREE.Mesh(
    new THREE.CircleGeometry(2.2, 32),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.18 })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.01;
  scene.add(shadow);

  // 회전 (드래그)
  var rotY = -0.45, rotX = 0.0, velY = 0, dragging = false, lastX = 0, lastY = 0, autoIdle = true;
  stage.addEventListener('pointerdown', function (e) {
    dragging = true; autoIdle = false; lastX = e.clientX; lastY = e.clientY;
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    rotY += dx * 0.012; velY = dx * 0.012;
    rotX = Math.max(-0.5, Math.min(0.5, rotX + dy * 0.008));
    lastX = e.clientX; lastY = e.clientY;
  });
  function endDrag() { dragging = false; }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  resize();

  // 말하기 상태
  var ampTarget = 0, amp = 0, manual = null, simulating = false, simNext = 0;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var api = {
    setAmplitude: function (v) { ampTarget = Math.max(0, Math.min(1, v)); }
  };
  window.clawd = api;

  // 눈 깜빡임
  var blinkAt = 2.5, blinkT = -1;

  var clock = new THREE.Clock();
  function frame() {
    var dt = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;

    // 소리 없는 시뮬레이션: 불규칙한 목표 진폭
    if (simulating && t > simNext) {
      ampTarget = 0.25 + Math.random() * 0.75;
      simNext = t + 0.09 + Math.random() * 0.14;
    }
    var target = manual !== null ? manual : ampTarget;
    // 진폭은 빨리 올라가고 천천히 내려옴
    var k = target > amp ? 14 : 6;
    amp += (target - amp) * Math.min(1, k * dt);
    // 단어 이벤트로 올린 값은 서서히 감쇠
    if (!simulating && manual === null) ampTarget *= Math.pow(0.02, dt);

    var m = reduceMotion ? 0.3 : 1;

    // 숨쉬기
    var breathe = Math.sin(t * 1.8) * 0.025;
    // 말할 때 들썩임 + 스쿼시
    var talkBob = Math.abs(Math.sin(t * 20)) * amp * 0.16 * m;
    rig.position.y = talkBob;
    rig.scale.set(1 + amp * 0.025 * m, 1 + breathe - amp * 0.03 * m, 1 + amp * 0.025 * m);
    rig.rotation.z = Math.sin(t * 11) * amp * 0.035 * m;

    // 팔 흔들기
    armL.rotation.z = Math.sin(t * 1.8) * 0.04 + amp * 0.35 * m * Math.sin(t * 14);
    armR.rotation.z = -Math.sin(t * 1.8) * 0.04 - amp * 0.35 * m * Math.sin(t * 14 + 1.2);

    // 깜빡임
    if (blinkT < 0 && t > blinkAt) { blinkT = 0; }
    if (blinkT >= 0) {
      blinkT += dt;
      var s = blinkT < 0.07 ? 1 - blinkT / 0.07 : (blinkT < 0.14 ? (blinkT - 0.07) / 0.07 : 1);
      eyeL.scale.y = eyeR.scale.y = Math.max(0.08, s);
      if (blinkT >= 0.14) { blinkT = -1; blinkAt = t + 2 + Math.random() * 3.5; eyeL.scale.y = eyeR.scale.y = 1; }
    }

    // 회전
    if (!dragging) {
      if (autoIdle) rotY += Math.sin(t * 0.5) * 0.002;
      else { rotY += velY; velY *= 0.92; }
    }
    root.rotation.y = rotY;
    root.rotation.x = rotX;
    shadow.scale.setScalar(1 - talkBob * 0.5);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();

  // UI
  var $ = function (id) { return document.getElementById(id); };
  var ampInput = $('amp'), ampVal = $('amp-val');
  ampInput.addEventListener('input', function () {
    var v = ampInput.value / 100;
    ampVal.textContent = v.toFixed(2);
    manual = v > 0 ? v : null;
  });

  var simBtn = $('btn-sim');
  simBtn.addEventListener('click', function () {
    simulating = !simulating;
    simBtn.setAttribute('aria-pressed', String(simulating));
    if (!simulating) ampTarget = 0;
  });

  var synth = window.speechSynthesis;
  function stopSpeech() {
    if (synth) synth.cancel();
    ampTarget = 0;
  }
  $('btn-stop').addEventListener('click', function () {
    stopSpeech();
    simulating = false;
    simBtn.setAttribute('aria-pressed', 'false');
  });
  $('btn-speak').addEventListener('click', function () {
    var text = $('say').value.trim();
    if (!text) return;
    if (!synth) { simulating = true; simBtn.setAttribute('aria-pressed', 'true'); return; }
    stopSpeech();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = 1.0;
    var voices = synth.getVoices();
    var ko = voices.filter(function (v) { return /^ko/i.test(v.lang); });
    var female = ko.filter(function (v) { return /female|yuna|sunhi|heami|유나|선희/i.test(v.name); })[0];
    if (female || ko[0]) u.voice = female || ko[0];
    var gotBoundary = false;
    u.onboundary = function () { gotBoundary = true; api.setAmplitude(0.6 + Math.random() * 0.4); };
    u.onstart = function () {
      // 단어 경계 이벤트를 지원하지 않는 환경 대비
      setTimeout(function () { if (!gotBoundary) { simulating = true; } }, 500);
    };
    u.onend = u.onerror = function () { simulating = false; simBtn.setAttribute('aria-pressed', 'false'); ampTarget = 0; };
    synth.speak(u);
  });
  if (synth && synth.onvoiceschanged !== undefined) synth.onvoiceschanged = function () {};

  $('btn-theme').addEventListener('click', function () {
    var root = document.documentElement;
    var dark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>
