<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clawd</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/clawd.css">
<style>
  html, body { height: 100%; }
  main { height: 100%; max-width: 560px; margin: 0 auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .stage { flex: 1 1 auto; min-height: 280px; }
  #cost { position: absolute; left: 10px; top: 8px; font-size: .75rem; color: var(--muted); pointer-events: none; font-variant-numeric: tabular-nums; }
  #cost.warn { color: var(--accent); font-weight: 600; }
  #conn { position: absolute; right: 10px; top: 8px; font-size: .75rem; color: var(--muted); pointer-events: none; }
  #voice { position: absolute; right: 8px; bottom: 8px; font: inherit; font-size: .75rem; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
  #voice[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); }
  #voice.locked { color: #fff; background: var(--accent); border-color: var(--accent); animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { #voice.locked { animation: none; } }
  #actions { display: flex; justify-content: center; gap: 8px; }
  #actions:empty { display: none; }
  #actions button { font: inherit; font-size: .8rem; padding: 4px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  form { display: flex; gap: 8px; }
  form input { flex: 1 1 auto; min-width: 0; padding: 10px 12px; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  form button { font: inherit; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  form button:disabled { opacity: .6; cursor: default; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="stage" id="stage"><div id="cost" hidden></div><div id="conn"></div><button id="voice" type="button" aria-pressed="false"></button></div>
  <div id="actions"></div>
  <form id="chat" autocomplete="off"><input id="msg" maxlength="2000" aria-label="message"><button id="send" type="submit"></button></form>
</main>
<script type="module" src="/dist/main.js"></script>
</body>
</html>
